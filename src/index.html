<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wiem Ben Salem · Software Engineer Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('wiem-theme');
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {
          /* ignore */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta
      name="description"
      content="Portfolio of Wiem Ben Salem — software engineer building structured and scalable software systems. Full-stack development, application architecture, and reliable digital solutions."
    />
    <meta property="og:title" content="Wiem Ben Salem · Software Engineer Portfolio" />
    <meta
      property="og:description"
      content="README-styled portfolio of Wiem Ben Salem — full-stack engineer, projects, experience, and more."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

</html>
