<div class="shell">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topnav">
    <div class="page topnav-inner">
      <a class="brand" routerLink="/">Wiem Ben Salem</a>

      <nav class="nav-links" aria-label="Primary">
        <a class="nav-link" routerLink="/projects" routerLinkActive="active">Projects</a>
        <a class="nav-link" routerLink="/experience" routerLinkActive="active">Experience</a>
        <a class="nav-link" routerLink="/skills" routerLinkActive="active">Skills</a>
        <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
      </nav>

      <div class="topnav-actions">
        <button
          class="theme-toggle"
          type="button"
          [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          [attr.title]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          (click)="toggleTheme()"
        >
          @if (theme === 'dark') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          }
        </button>

        <a class="btn btn-sm topnav-resume" [href]="profile.cvUrl" download>Resume</a>
      </div>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <div class="page main-inner">
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer class="footer">
    <div class="page footer-inner">
      <span>&copy; {{ year }} {{ profile.name }}</span>
      <span class="footer-right quest-label">Angular &middot; Tailwind</span>
    </div>
  </footer>
</div>
