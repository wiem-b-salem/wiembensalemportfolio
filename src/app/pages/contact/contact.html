<div class="page-head">
  <h1 class="page-title">Contact</h1>
  <p class="page-sub">Open to internship opportunities, collaborative projects, and new experiences.</p>
</div>

<div class="contact-list section">
  <a class="card contact-row" [href]="'mailto:' + profile.email">
    <span class="quest-label contact-label">Email</span>
    <span class="contact-value">{{ profile.email }}</span>
    <span class="quest-label contact-arrow" aria-hidden="true">↗</span>
  </a>

  <a class="card contact-row" [href]="profile.github" target="_blank" rel="noopener noreferrer">
    <span class="quest-label contact-label">GitHub</span>
    <span class="contact-value">github.com/wiem-b-salem</span>
    <span class="quest-label contact-arrow" aria-hidden="true">↗</span>
  </a>

  <a class="card contact-row" [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">
    <span class="quest-label contact-label">LinkedIn</span>
    <span class="contact-value">in/wiem-ben-salem</span>
    <span class="quest-label contact-arrow" aria-hidden="true">↗</span>
  </a>

  <a class="card contact-row" [href]="profile.cvUrl" download>
    <span class="quest-label contact-label">Resume</span>
    <span class="contact-value">wiem-ben-salem-cv.pdf</span>
    <span class="quest-label contact-arrow" aria-hidden="true">↓</span>
  </a>
</div>

<div class="contact-note">
  <blockquote class="note">
    The best way to reach me is by email — I usually respond within a few days.
  </blockquote>
</div>
