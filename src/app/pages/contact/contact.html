<div class="doc-head">
  <h1 class="doc-title"><span class="md-hash" aria-hidden="true">##</span> contact.md</h1>
  <p class="doc-sub">Open to internship opportunities, collaborative projects, and new experiences.</p>
</div>

<div class="repo-list contact-list">
  <a class="repo-row contact-row" [href]="'mailto:' + profile.email">
    <span class="contact-label">Email</span>
    <span class="contact-value">{{ profile.email }}</span>
    <span class="contact-arrow" aria-hidden="true">↗</span>
  </a>

  <a class="repo-row contact-row" [href]="profile.github" target="_blank" rel="noopener noreferrer">
    <span class="contact-label">GitHub</span>
    <span class="contact-value">github.com/wiem-b-salem</span>
    <span class="contact-arrow" aria-hidden="true">↗</span>
  </a>

  <a class="repo-row contact-row" [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">
    <span class="contact-label">LinkedIn</span>
    <span class="contact-value">in/wiem-ben-salem</span>
    <span class="contact-arrow" aria-hidden="true">↗</span>
  </a>

  <a class="repo-row contact-row" [href]="profile.cvUrl" download>
    <span class="contact-label">Resume</span>
    <span class="contact-value">wiem-ben-salem-cv.pdf</span>
    <span class="contact-arrow" aria-hidden="true">↓</span>
  </a>
</div>

<div class="contact-note">
  <blockquote class="md-blockquote">
    The best way to reach me is by email — I usually respond within a few days.
  </blockquote>
</div>
